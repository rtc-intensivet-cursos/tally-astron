name: Tally para Astron (MOVE 2026 e Aula Aberta Intensiflix)

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos; cada formulário tem a sua data final no config.json ("ate")
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  actions: write

concurrency:
  group: tally-astron
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cadastrar novos inscritos na Astron
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          ASTRON_AM_KEY: ${{ secrets.ASTRON_AM_KEY }}
          ASTRON_AM_SECRET: ${{ secrets.ASTRON_AM_SECRET }}
        run: python tally_astron.py
      - name: Guardar a lista de inscrições já tratadas
        if: always()
        run: |
          git config user.name "tally-astron"
          git config user.email "actions@users.noreply.github.com"
          git add processados.json || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Atualiza inscrições tratadas"
            for i in 1 2 3; do
              git pull -q --rebase && git push -q && exit 0
              sleep 5
            done
            exit 1
          fi
