name: Tally para Astron (MOVE 2026)

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (desliga sozinho depois do evento, 28/11/2026)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  actions: write

concurrency:
  group: tally-astron
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Desligar sozinho depois do evento (formulários fecham 28/11 às 9h)
        id: prazo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261128 ]; then
            gh workflow disable tally-astron.yml -R "$GITHUB_REPOSITORY"
            echo "fim=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.prazo.outputs.fim != '1'
      - uses: actions/setup-python@v5
        if: steps.prazo.outputs.fim != '1'
        with:
          python-version: "3.12"
      - name: Cadastrar novos inscritos na Astron
        if: steps.prazo.outputs.fim != '1'
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
          ASTRON_AM_KEY: ${{ secrets.ASTRON_AM_KEY }}
          ASTRON_AM_SECRET: ${{ secrets.ASTRON_AM_SECRET }}
        run: python tally_astron.py
      - name: Guardar a lista de inscrições já tratadas
        if: always() && steps.prazo.outputs.fim != '1'
        run: |
          git config user.name "tally-astron"
          git config user.email "actions@users.noreply.github.com"
          git add processados.json || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Atualiza inscrições tratadas"
            for i in 1 2 3; do
              git pull -q --rebase && git push -q && exit 0
              sleep 5
            done
            exit 1
          fi
